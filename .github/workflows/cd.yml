name: CD - 构建可部署产物

# 持续交付：手动触发，或打版本标签（v*）时触发
# 将测试通过的代码打包为可随时部署的产物（后端 jar + 前端 dist）
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  package:
    name: 打包可部署产物
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: 构建后端可执行 jar（跳过测试，测试由 CI 把关）
        run: mvn -B -f backend/pom.xml -DskipTests package

      - name: 配置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        working-directory: frontend
        run: npm ci && npm run build

      - name: 整理部署产物
        run: |
          mkdir -p deploy-package
          cp backend/target/library-1.0.0.jar deploy-package/app.jar
          cp -r frontend/dist deploy-package/dist
          cp db/init.sql deploy-package/init.sql

      - name: 上传部署产物
        uses: actions/upload-artifact@v4
        with:
          name: library-package
          path: deploy-package/

# 说明：目标服务器就绪后，可在本 Job 之后追加 SSH 部署步骤
# （如 scp 产物到服务器并重启服务），实现真正的自动上线。
